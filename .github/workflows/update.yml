name: Update Hipermaxi
on: [workflow_call]
jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: python install
        run: |
          python -m pip install --upgrade pip
          pip install -r update/requirements.txt
      - name: update data
        run: |
          python update/hipermaxi.py
      - name: commit
        run: |
          git config --global user.email "precios-bot@example.com"
          git config --global user.name "precios-bot"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[ci] hipermaxi $(date '+%Y-%m-%d')"
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push -q "https://$GH_TOKEN@github.com/mauforonda/precios.git" HEAD:master; then
                exit 0
              fi
              echo "Push failed on attempt $attempt; retrying after syncing with master."
            done
            echo "Push failed after 3 attempts." >&2
            exit 1
          fi
