name: Publicar visor

on:
  # Después de cada actualización de datos exitosa
  workflow_run:
    workflows:
      - "Update Hipermaxi"
      - "Update multicenter"
      - "Update Fidalga Farmacorp"
    types: [completed]
  # Manual
  workflow_dispatch:
  # Cambios del visor o del generador de parquet
  push:
    branches: [master]
    paths:
      - "view/**"
      - ".github/workflows/publish.yml"

# Una publicación a la vez; las siguientes esperan en cola
concurrency:
  group: publicar-visor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    name: publicar
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: view/requirements.txt

      - name: python install
        run: pip install -r view/requirements.txt

      - name: sitio
        run: python view/build.py

      - name: parquet
        run: python view/preparar.py

      - name: sin jekyll
        run: touch view/dist/.nojekyll

      - name: publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./view/dist
          user_name: precios-bot
          user_email: precios-bot@example.com
