name: Publicar visor

on:
  # Después de cada actualización de datos exitosa
  workflow_run:
    workflows:
      - "Update Hipermaxi"
      - "Update multicenter"
      - "Update Fidalga Farmacorp"
    types: [completed]
  # Manual
  workflow_dispatch:
  # Cambios del visor o del generador de datos
  push:
    branches: [master]
    paths:
      - "view/**"
      - ".github/workflows/publish.yml"

# Una publicación a la vez; las siguientes esperan en cola
concurrency:
  group: publicar-visor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    name: publicar
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: master

      # Publicación anterior: de ahí se retienen los archivos de datos de las últimas versiones.
      # Una pestaña abierta con un manifiesto viejo (o un CDN que aún sirve el manifiesto viejo)
      # sigue encontrando sus archivos. Si gh-pages no existe, se publica sin retención.
      - name: publicación anterior
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: previo
          fetch-depth: 1

      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: view/requirements.txt

      - name: python install
        run: pip install -r view/requirements.txt

      - name: sitio
        run: python view/build.py

      - name: datos
        run: |
          if [ -d previo/datos ]; then
            python view/preparar.py --previo previo/datos
          else
            python view/preparar.py
          fi

      - name: sin jekyll
        run: touch view/dist/.nojekyll

      - name: publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./view/dist
          user_name: precios-bot
          user_email: precios-bot@example.com
          # gh-pages queda en un solo commit: sin esto cada publicación suma decenas de MB al historial
          force_orphan: true
